<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>All In - AI 网关</title>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --card:#161b22; --line:#30363d; --text:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --err:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .card h2 { font-size:14px; margin:0 0 10px; color:var(--dim); font-weight:600; letter-spacing:.5px; }
  .row { display:flex; justify-content:space-between; padding:4px 0; font-size:13px; }
  .row span:last-child { color:var(--accent); font-variant-numeric: tabular-nums; }
  button { background:#21262d; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; }
  button:active { background:#30363d; }
  button:disabled { opacity:.5; }
  button.primary { background:#1f6feb; border-color:#1f6feb; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .err { color:var(--err); } .dim { color:var(--dim); }
  pre { background:#0b0f14; border:1px solid var(--line); border-radius:8px; padding:10px; font-size:11px; overflow:auto; max-height:220px; margin:8px 0 0; white-space:pre-wrap; word-break:break-all; }
  input { background:#0b0f14; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 10px; font-size:13px; width:100%; }
  .models { display:flex; flex-wrap:wrap; gap:6px; }
  .tag { background:#21262d; border:1px solid var(--line); border-radius:6px; padding:3px 8px; font-size:11px; color:var(--dim); }
</style>
</head>
<body>
  <h1>All In</h1>
  <div class="sub">手机上的 AI 网关 · <span id="endpoint">-</span></div>

  <div class="card">
    <h2>网关口令</h2>
    <input id="key" placeholder="粘贴 authKey，回车保存" autocomplete="off">
    <div class="dim" style="font-size:11px;margin-top:6px">只存在本机浏览器，用于调用本页面接口</div>
  </div>

  <div class="card">
    <h2>运行状态</h2>
    <div id="status"><span class="dim">加载中…</span></div>
  </div>

  <div class="card">
    <h2>WorkBuddy 每日签到</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="primary" id="btnCheckin">立刻签到</button>
      <button id="btnStatus">查签到状态</button>
    </div>
    <div id="checkinResult" style="margin-top:8px"></div>
    <pre id="checkinDetail" style="display:none"></pre>
  </div>

  <div class="card">
    <h2>可用模型 <span id="modelCount" class="dim"></span></h2>
    <div class="models" id="models"><span class="dim">加载中…</span></div>
  </div>

<script>
const $ = s => document.querySelector(s);
const keyEl = $('#key');

// 口令：优先 URL hash（#key=xxx），其次本地存储
(function initKey(){
  const m = location.hash.match(/key=([^&]+)/);
  if (m) { keyEl.value = decodeURIComponent(m[1]); localStorage.setItem('allin_key', keyEl.value); }
  else { keyEl.value = localStorage.getItem('allin_key') || ''; }
})();
keyEl.addEventListener('change', () => { localStorage.setItem('allin_key', keyEl.value.trim()); refresh(); });

function api(path, opts = {}) {
  const k = keyEl.value.trim();
  return fetch(path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + k, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  }).then(async r => {
    const text = await r.text();
    let data; try { data = JSON.parse(text); } catch { data = { raw: text }; }
    if (!r.ok) throw new Error((data.error && (data.error.message || data.error)) || ('HTTP ' + r.status));
    return data;
  });
}

async function refresh() {
  try {
    const s = await api('/api/status');
    $('#status').innerHTML = [
      ['运行时长', fmtDur(s.uptimeSec)],
      ['请求数', s.requests],
      ['错误数', s.errors],
      ['供应商', s.providers],
      ['账号', s.accounts],
      ['模型', s.models],
    ].map(([k, v]) => `<div class="row"><span>${k}</span><span>${v}</span></div>`).join('');
    $('#endpoint').textContent = location.host + '/v1';
  } catch (e) {
    $('#status').innerHTML = `<span class="err">${e.message}</span>`;
  }
  try {
    const m = await api('/api/models');
    const list = m.data || [];
    $('#modelCount').textContent = `(${list.length})`;
    $('#models').innerHTML = list.length
      ? list.map(x => `<span class="tag">${x.id}</span>`).join('')
      : '<span class="dim">还没有模型，先到配置文件里加供应商</span>';
  } catch (e) {
    $('#models').innerHTML = `<span class="err">${e.message}</span>`;
  }
}

function fmtDur(sec) {
  if (!sec && sec !== 0) return '-';
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  if (d) return `${d}天${h}小时`;
  if (h) return `${h}小时${m}分`;
  return `${m}分`;
}

$('#btnCheckin').addEventListener('click', async (e) => {
  const btn = e.target; btn.disabled = true;
  $('#checkinResult').innerHTML = '<span class="dim">正在签到…</span>';
  try {
    const d = await api('/api/workbuddy/checkin', { method: 'POST', body: '{}' });
    const parts = [`成功 ${d.succeeded || 0}`, `已签 ${d.already || 0}`, `失败 ${d.failed || 0}`];
    if (d.skipped) parts.push(`跳过 ${d.skipped}`);
    const cls = (d.failed || 0) > 0 ? 'warn' : 'ok';
    $('#checkinResult').innerHTML = `<span class="${cls}">${parts.join(' · ')}</span>`;
    $('#checkinDetail').style.display = 'block';
    $('#checkinDetail').textContent = JSON.stringify(d.results || d, null, 2);
  } catch (err) {
    $('#checkinResult').innerHTML = `<span class="err">${err.message}</span>`;
  } finally { btn.disabled = false; }
});

$('#btnStatus').addEventListener('click', async (e) => {
  const btn = e.target; btn.disabled = true;
  try {
    const d = await api('/api/workbuddy/checkin-status');
    $('#checkinDetail').style.display = 'block';
    $('#checkinDetail').textContent = JSON.stringify(d, null, 2);
  } catch (err) {
    $('#checkinResult').innerHTML = `<span class="err">${err.message}</span>`;
  } finally { btn.disabled = false; }
});

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
